# Preview and review the recurring cost in Render before applying this Blueprint.
envVarGroups:
  - name: arena-ep3-runtime
    envVars:
      - key: JWT_SECRETO
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "0"

services:
  - type: pserv
    name: arena-ep3-user
    runtime: docker
    branch: main
    region: virginia
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    envVars:
      - fromGroup: arena-ep3-runtime
      - key: MODULO
        value: "msvc-user-service"
      - key: PORT
        value: "8000"
      - key: DB_URL
        sync: false
      - key: DB_USUARIO
        sync: false
      - key: DB_CLAVE
        sync: false
      - key: NOTIFICATION_SERVICE_HOSTPORT
        fromService:
          name: arena-ep3-notification
          type: pserv
          property: hostport

  - type: pserv
    name: arena-ep3-game
