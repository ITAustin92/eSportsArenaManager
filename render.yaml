services:
  - type: web
    name: esports-arena-manager-api
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USUARIO
        sync: false
      - key: DB_CLAVE
        sync: false
      - key: JWT_SECRETO
        generateValue: true
      - key: CORS_ORIGENES
        value: https://esports-arena-managerv2.vercel.app
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_CORREO
        sync: false
