# Demostración local: H2 y datos ficticios. Para persistencia usar el perfil prod.
x-entorno: &entorno
  EUREKA_URL: http://msvc-eureka:8761/eureka/
  JWT_SECRETO: ${JWT_SECRETO:?Define JWT_SECRETO en backend/.env}
  USER_SERVICE_URL: http://msvc-user-service:8000

services:
  msvc-eureka:
    build:
      context: .
      args:
        MODULO: msvc-eureka
    ports:
      - '8761:8761'
  msvc-user-service:
    build:
      context: .
      args:
        MODULO: msvc-user-service
    depends_on:
      - msvc-eureka
    environment:
      <<: *entorno
      PORT: 8000
      SERVICIOS_USER_URL: http://msvc-user-service:8000
      SERVICIOS_GAME_URL: http://msvc-game-service:8001
      SERVICIOS_TEAM_URL: http://msvc-team-service:8002
      SERVICIOS_TOURNAMENT_URL: http://msvc-tournament-service:8003
      SERVICIOS_REGISTRATION_URL: http://msvc-registration-service:8004
      SERVICIOS_MATCH_URL: http://msvc-match-service:8005
      SERVICIOS_RESULT_URL: http://msvc-result-service:8006
      SERVICIOS_RANKING_URL: http://msvc-ranking-service:8007
      SERVICIOS_SANCTION_URL: http://msvc-sanction-service:8008
      SERVICIOS_PRIZE_URL: http://msvc-prize-service:8009
      SERVICIOS_NOTIFICATION_URL: http://msvc-notification-service:8010
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/actuator/health']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
  msvc-game-service:
    build:
      context: .
      args:
