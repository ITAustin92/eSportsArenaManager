eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
jwt:
  # Duración del token. El frontend lo renueva (POST /api/v1/auth/refresh) antes de que venza.
  expiration-minutes: 60
  secret: ${JWT_SECRETO:clave-secreta-super-segura-para-jwt-esports-arena-manager-grupo18-2026}
# URL directa de msvc-user-service (crea el perfil al registrar una cuenta)
servicios:
  user-service-url: ${USER_SERVICE_URL:http://localhost:8000}
server:
  port: ${PORT:8099}
spring:
  application:
    name: msvc-auth-service
  datasource:
    driver-class-name: org.h2.Driver
    password: sa
    url: jdbc:h2:file:./data/auth
    username: sa
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # create-drop igual que user-service: las cuentas sembradas siempre calzan con sus perfiles
      ddl-auto: create-drop
    show-sql: true
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /docs/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

---
spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 10000
